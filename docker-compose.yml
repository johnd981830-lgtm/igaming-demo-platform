version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: igaming-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: igaming
      POSTGRES_USER: igaming
      POSTGRES_PASSWORD: igaming
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: igaming-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
